name: Scheduled Upstream Sync

on:
  schedule:
    - cron: '0 0 * * *' # Runs automatically every day at midnight UTC
  workflow_dispatch: # Allows you to manually trigger the sync via a button

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Fork
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Sync with Upstream
        run: |
          # Configure Git
          git config --global user.name "GitHub Actions"
          git config --global user.email "actions@github.com"
          
          # Add original repo as upstream
          git remote add upstream https://github.com/imrantarik-ux/SRM-IST
          git fetch upstream main
          
          # Checkout your main branch and merge upstream changes
          git checkout main
          git merge upstream/main --ff-only || (echo "Merge conflict detected; manual sync required." && exit 1)
          
          # Push the updates back to your fork
          git push origin main
